<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>產品流量分析 — 百思特</title>
<style>
:root{
  --bg:#eef1f6; --card:#fff; --line:#d8dfe8; --text:#16202e; --muted:#66768c;
  --accent:#1e5fa8; --accent-soft:#e5eff9; --head:#eaeff6;
  --sale:#d32f2f; --buy:#2e7d32; --stock:#1565c0; --price:#7b1fa2;
  --ok:#237a3a; --ok-bg:#e6f4ea; --warn:#b06a10; --warn-bg:#fdf1de;
  --bad:#c0271f; --bad-bg:#fceceb; --cool:#5a6878; --cool-bg:#eceff3;
  /* 物流三色（使用者指定：海運＝藍、海快＝綠、巧巧郎＝菊） */
  --sea:#1565c0;   --sea-bg:#e3f0fb;
  --fast:#2e7d32;  --fast-bg:#e6f4ea;
  --qiao:#9a6b12;  --qiao-bg:#f7eeda;
  --aside-w:180px; --chart-h:200px;
  /* 版面（A3：左右間距／列高可調，字級隨列高走）→ 每個分頁各自一組（B2） */
  --cell-pad:6px; --rowh:22px; --cell-fs:11.5px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11151b; --card:#181f28; --line:#2a3441; --text:#e3e9f1; --muted:#8d9bb0;
    --accent:#5197e0; --accent-soft:#1b2938; --head:#1e2732;
    --sale:#ef5350; --buy:#66bb6a; --stock:#42a5f5; --price:#ba68c8;
    --ok:#5cc47c; --ok-bg:#16301f; --warn:#dda44a; --warn-bg:#30240f;
    --bad:#ef6b62; --bad-bg:#341917; --cool:#94a3b5; --cool-bg:#212a35;
    --sea:#5aa9ef;  --sea-bg:#12283c;
    --fast:#6cc47a; --fast-bg:#12301c;
    --qiao:#d9ad55; --qiao-bg:#302509;
  }
}
*{box-sizing:border-box}
/* ⭐ 整站固定在一個螢幕內（2026-08-05 使用者指定）：**外層永遠不捲**——
   不管選 7 天還是 120 天，左右都不要出現橫向捲軸，上下也不要捲整頁。
   做法：body 撐滿視窗高度 `overflow:hidden`，內部用 flex 分配，
   **需要捲的只有各自的小區塊**（分類清單、表格），使用者在區塊內捲沒問題。 */
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:12px;
  font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;line-height:1.45;
  overflow:hidden;display:flex;flex-direction:column}
header,.bar{flex:none}
body.dragging{user-select:none;cursor:crosshair}
header{background:var(--card);border-bottom:1px solid var(--line);padding:6px 10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:14px;font-weight:700;white-space:nowrap}
h1 span{color:var(--accent)}
.meta{font-size:11px;color:var(--muted)}
.meta b{color:var(--text)}
.sp{flex:1}
button{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--card);
  color:var(--text);border-radius:5px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0;padding:3px 9px}
.seg button:last-child{border-right:0}
.tabs{display:flex;gap:2px}
.tabs button{border-radius:6px 6px 0 0;border-bottom:0;padding:5px 14px;font-weight:600;
  background:transparent;border-color:transparent;color:var(--muted)}
.tabs button.on{background:var(--card);border-color:var(--line);color:var(--accent);
  box-shadow:0 -1px 0 var(--accent) inset}
/* ---- 工具列 ---- */
.bar{background:var(--card);border-bottom:1px solid var(--line);padding:5px 10px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px}
.bar label{color:var(--muted)}
input[type=date]{font:inherit;font-size:11.5px;padding:2px 5px;border:1px solid var(--line);
  border-radius:4px;background:var(--card);color:var(--text)}
/* ---- 版面 ---- */
/* 側邊欄＋分頁區：側邊欄由「流量分析／銷售分析」共用，決策頁自動隱藏 */
.applayout{display:grid;grid-template-columns:var(--aside-w) 1fr;gap:7px;padding:7px;
  align-items:stretch;flex:1;min-height:0}
.applayout.nosb{grid-template-columns:1fr}
.applayout.nosb aside{display:none}
.pagewrap{display:flex;flex-direction:column;min-height:0;min-width:0}
@media(max-width:860px){.applayout{grid-template-columns:1fr}.applayout aside{display:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:7px}
/* 側邊欄：撐滿視窗高度。三個分類清單**依「現在要選哪一層」動態分配高度**
   （2026-08-05 使用者指定，取代原本的「平分」）：
     沒選大類 → 下一步是選大類 → 大類全展開
     選了大類 → 下一步是選中類 → 中類全展開、大類讓位
     選了中類 → 下一步是選小類 → 小類全展開、空間其次給中類、**大類縮最小**
     按「全部」＝退一步 → 焦點自動回到上一層（大類改全部就回到第一種情況）
   做法：flex-basis 用內容自然高度（`0 1 auto`），空間夠時大家都完整列出；
   不夠時**只壓非焦點層**（焦點層 flex-shrink:0），離焦點越遠壓得越兇。 */
/* ⚠️ 一定要 position:relative——拖曳把手 `.grip.v` 是 absolute right:-4px，
   以前靠 `position:sticky` 當定位基準；改成 flex 版面後沒了基準會跑到視窗外，
   撐出 4px 的橫向捲軸（2026-08-05 量到）。 */
aside{position:relative;height:100%;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.sec{border-bottom:1px solid var(--line);padding:6px 8px;flex:none}
.sec:last-child{border-bottom:0}
.sec.grow{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.sec.grow .rlist{flex:1 1 auto;min-height:0}
/* 空間怎麼分（2026-08-06 使用者修正）：
   ▸ **沒有人硬佔比例**——每一層的基準高度就是它自己的內容高度（`flex-basis:auto`）。
     焦點層用不到那麼多就不要留白（以前寫死 min-height:62%，中類只有兩項時下面一片空白）。
   ▸ **多出來的空間一律給大類**（只有 #sec1 有 flex-grow）——大類是「返回上一層」的入口，
     空間夠時就讓它整份列出來。
   ▸ 空間不夠時才壓縮，順序是「離焦點越遠越先被壓」；焦點層最後才被壓，
     所以清單很長時它自然拿到最大的一塊（實測 83%），不必也不該寫死比例。
   ▸ 被壓到最小的那層至少留得下「標題＋一行」＝ 看得到 **【全部】** 這個返回選項。
   ⚠️ `flex-shrink` 不可以小於 1：規範規定「未凍結項的 shrink 總和 < 1 時只壓縮
      (總和×需要量)」，設 0.01 等於幾乎不壓，清單會撐破側邊欄（實測佔到 124%）。 */
#sec1{flex-grow:1}                                           /* 剩餘空間都給大類 */
.sec.grow.pri1{flex-shrink:1}                                /* 焦點層：最後才被壓 */
.sec.grow.pri2{flex-shrink:60;min-height:74px}               /* 上一層：先讓位，保有 2~3 行 */
.sec.grow.pri3{flex-shrink:400;min-height:52px}              /* 更上層：壓到剩「全部」一行 */
/* ⚠️ 焦點層**不能**設 flex-shrink:0：清單很長時（例如 09.紅點 有 64 個中類＝1195px）
   會把 aside 撐破，而 aside 是 overflow:hidden → 下半截看不到也捲不到（2026-08-05 量到）。
   正解是「焦點層也能被壓，只是最後才輪到它」，壓到極限就由 .rlist 自己捲。 */
.sec.hide{display:none}
.sec>h4{margin:0 0 4px;font-size:11px;color:var(--muted);font-weight:700;flex:none}
.rlist{overflow:auto}
.rlist label,.clist label{display:block;padding:1px 3px;border-radius:3px;cursor:pointer;
  font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlist label:hover,.clist label:hover{background:var(--accent-soft)}
.rlist input,.clist input{margin:0 4px 0 0;vertical-align:-1px}
.rlist label.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
input[type=text]{font:inherit;font-size:11.5px;padding:3px 6px;border:1px solid var(--line);
  border-radius:4px;background:var(--card);color:var(--text);width:100%}
/* 只在設定模式（⚙）展開的區塊：345 的物流前置期與九條策略門檻 */
.cfgonly{display:none}
body.cfg .cfgonly{display:block}
body.cfg #planParamHint{display:none}
/* 拖曳把手（設定模式才出現） */
.grip{position:absolute;background:transparent;z-index:40}
.grip.v{top:0;right:-4px;width:8px;height:100%;cursor:col-resize}
.grip.h{left:0;bottom:-4px;height:8px;width:100%;cursor:row-resize}
body.cfg .grip{background:var(--accent);opacity:.22}
body.cfg .grip:hover{opacity:.5}
/* ---- 統計 ----
   2026-08-05 使用者回報「報表最上面的數字看不到、可以大一點嗎」：
     ①**數字加大**（13.5 → 18px，標題 10 → 11px，上下留白加大）
     ②**黏在視窗頂端**（`position:sticky`）——以前捲動去看圖表時整條會捲出畫面，
       只剩被切一半的數字。表頭 `th` 的 top 改成讓開統計列高度（`--stats-h`，JS 量測），
       兩者才不會疊在一起。 */
/* ⚠️ 整站改成不捲之後，統計列**不需要也不可以** sticky：
   它跟表格在不同的 panel，sticky 會讓表頭 `th` 被迫讓開一段距離，
   捲動表格時表頭就浮在資料列中間（2026-08-05 使用者截圖的「標題欄跑掉」）。
   現在外層不捲、統計列本來就一直在畫面上，表頭只要黏在表格自己的捲動容器頂端就好。 */
.stats{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-radius:7px 7px 0 0;
  overflow:hidden;flex:none}
.stat{background:var(--card);padding:6px 11px;flex:1;min-width:92px}
.stat .k{font-size:11px;color:var(--muted);line-height:1.3}
.stat .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
.v.sale{color:var(--sale)}.v.buy{color:var(--buy)}.v.stock{color:var(--stock)}
/* ---- 圖表 ---- */
.chartbox{padding:6px 9px 2px;position:relative}
.chartbar{display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap}
.chartbar .ttl{font-size:12px;font-weight:700;color:var(--accent)}
.chartbar label{font-size:11.5px;cursor:pointer;white-space:nowrap}
/* 圖表永遠塞進容器寬度（2026-08-05）：以前是 `Math.max(容器寬, 天數×46)`，
   選 120 天就撐出橫向捲軸要一直往右滑。現在天數多就自己壓縮。 */
.cwrap{overflow:hidden;position:relative}
svg.chart{display:block}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--accent);
  border-radius:5px;padding:4px 7px;font-size:11.5px;box-shadow:0 3px 10px rgba(0,0,0,.16);
  z-index:50;display:none;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* ---- 表格（A3：padding／列高／字級都吃 CSS 變數） ---- */
/* 表格區＝唯一會上下捲的地方（填滿剩餘高度、內部捲）。橫向一律不捲：欄位自己縮。 */
.tscroll{overflow-y:auto;overflow-x:hidden;border-top:1px solid var(--line);flex:1;min-height:0}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--cell-fs);
  font-variant-numeric:tabular-nums}
th,td{padding:0 var(--cell-pad);height:var(--rowh);border-bottom:1px solid var(--line);
  white-space:nowrap;text-align:right}
th{background:var(--head);position:sticky;top:0;z-index:8;font-size:calc(var(--cell-fs) - .5px);
  font-weight:600;color:var(--muted);border-bottom:1.5px solid var(--line);
  cursor:pointer;user-select:none}
th:hover{color:var(--accent)}
/* 設定模式下可以像 Excel 一樣拖曳欄位邊界調寬度（2026-08-05 使用者第 3 項）。
   把手只在設定模式出現，平常不干擾點擊排序。 */
th{position:sticky}
.colgrip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;
  display:none;z-index:9}
body.cfg .colgrip{display:block;background:var(--accent);opacity:.18}
body.cfg .colgrip:hover{opacity:.55}
body.cfg th{position:sticky}
table{table-layout:auto}
table.fixw{table-layout:fixed}
th.l,td.l{text-align:left}
td.code{position:sticky;left:0;background:var(--card);z-index:6;font-family:Consolas,monospace;
  font-weight:600;color:var(--accent);width:1%}
td.code span{display:inline-block;max-width:78px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;vertical-align:bottom}
th.code{left:0;z-index:9;background:var(--head);width:1%}
tr:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
tr.msel td{background:var(--warn-bg)}
tr.msel td.code{background:var(--warn-bg)}
.nm{display:inline-block;max-width:210px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;vertical-align:bottom}
.dim{color:var(--muted)}.zero{color:var(--line)}
.tag{display:inline-block;padding:0 5px;border-radius:4px;font-size:calc(var(--cell-fs) - 1px);font-weight:700}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)}.t-cool{background:var(--cool-bg);color:var(--cool)}
.t-sea{background:var(--sea-bg);color:var(--sea)}
.t-fast{background:var(--fast-bg);color:var(--fast)}
.t-qiao{background:var(--qiao-bg);color:var(--qiao)}
.lnk{cursor:pointer;text-decoration:underline dotted}
.lnk:hover{color:var(--accent)}
.foot{display:flex;justify-content:space-between;align-items:center;padding:4px 9px;
  border-top:1px solid var(--line);background:var(--head);font-size:11px;color:var(--muted);
  flex-wrap:wrap;gap:8px;border-radius:0 0 7px 7px}
.pg{display:flex;gap:4px;align-items:center}
.pg button{padding:1px 7px;font-size:11px}
.empty,.load{padding:32px;text-align:center;color:var(--muted)}
input.ordin{width:74px;font:inherit;font-size:var(--cell-fs);font-weight:700;text-align:right;
  padding:0 4px;border:1px solid var(--line);border-radius:4px;background:var(--card);
  color:var(--sale);font-variant-numeric:tabular-nums}
input.ordin:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input.ordin.chg{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
input.boxin{width:56px;font:inherit;font-size:var(--cell-fs);text-align:right;padding:0 3px;
  border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text)}
input.boxin.chg{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
input[type=number]{font:inherit;font-size:11.5px;padding:2px 5px;border:1px solid var(--line);
  border-radius:4px;background:var(--card);color:var(--text)}
.err{background:var(--bad-bg);color:var(--bad);padding:10px;border-radius:7px;margin:7px}
.hint{font-size:10.5px;color:var(--muted);margin-top:3px}
/* ---- 篩選列（B1） ---- */
tr.frow th{position:sticky;top:var(--rowh);z-index:7;background:var(--card);padding:1px 3px;
  cursor:default;border-bottom:1px solid var(--line)}
tr.frow input,tr.frow select{width:100%;min-width:52px;font:inherit;font-size:10.5px;
  padding:1px 3px;border:1px solid var(--line);border-radius:3px;background:var(--card);
  color:var(--text)}
tr.frow input:not(:placeholder-shown),tr.frow select.act{border-color:var(--accent);
  background:var(--accent-soft)}
/* ---- 多選合計列（A6） ---- */
.selbar{display:none;align-items:center;gap:12px;padding:4px 9px;background:var(--warn-bg);
  border-top:1px solid var(--warn);font-size:11.5px;flex-wrap:wrap}
.selbar.on{display:flex}
.selbar b{font-variant-numeric:tabular-nums}
.selbar .k{color:var(--muted);font-size:10.5px}
/* ---- 設定面板 ---- */
.cfgpanel{display:none;background:var(--card);border-bottom:1px solid var(--line);padding:8px 10px}
body.cfg .cfgpanel{display:block}
.cfgrow{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.cfgcol h4{margin:0 0 4px;font-size:11px;color:var(--muted)}
.cfgcol .clist{columns:2;column-gap:16px;max-width:330px}
.cfgnote{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.slrow{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:11px}
.slrow label{width:64px;color:var(--muted)}
.slrow input[type=range]{width:118px}
.slrow b{width:44px;text-align:right;font-variant-numeric:tabular-nums}
/* 分頁本身就是「剩下的整個畫面」；內部再用 flex 切成 圖表區(固定高)＋表格區(填滿、自己捲) */
.page{display:none}
.page.on{display:flex;flex-direction:column;flex:1;min-height:0}
.page.on>.pad{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0;gap:7px}
.page.on>.pad>.panel:last-child{flex:1;min-height:0;display:flex;flex-direction:column}
/* ---- 策略開關（B7） ---- */
.spbox{display:flex;gap:14px;flex-wrap:wrap;padding:6px 10px;border-top:1px solid var(--line)}
.spitem{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap}
.spitem input[type=number]{width:56px}
.spitem label{cursor:pointer}
/* ---- 回填預覽（B4/B5/B6） ---- */
.mask{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:90;display:none;
  align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:9px;max-width:960px;
  width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal h3{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.modal .body{overflow:auto;padding:0 12px}
.modal .act{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.modal table{font-size:11px}
.old{color:var(--muted);text-decoration:line-through}
.new{color:var(--warn);font-weight:700}
</style>
</head>
<body>

<header>
  <h1>百思特 <span>報表</span></h1>
  <div class="tabs" id="tabs">
    <button data-p="flow" class="on">產品流量分析</button>
    <button data-p="sale">銷售分析</button>
    <button data-p="plan">345 進貨決策</button>
  </div>
  <div class="meta" id="meta">載入中…</div>
  <div class="sp"></div>
  <button id="btnCfg">⚙ 設定模式</button>
  <button class="primary" id="btnRefresh">↻ 立即更新</button>
</header>

<div class="cfgpanel">
  <div class="cfgrow">
    <div class="cfgcol"><h4 id="colPickTitle">顯示欄位</h4><div class="clist" id="colPick"></div></div>
    <div class="cfgcol" id="statPickBox"><h4>顯示統計</h4><div class="clist" id="statPick"></div></div>

/* =========================================================================
   設定：**每個分頁各自一組**（B2）＋版面可調（A3）
   ========================================================================= */
const CFGKEY='tmsflow.cfg.v2';
const DEF_LAY={pad:6,rowh:22,fs:100};      // fs＝字級微調倍率(%)
// cw＝欄寬（{欄位key: px}，設定模式拖曳出來的，key-based 不怕欄位增刪）
const LAY={flow:{...DEF_LAY,aw:'180px',ch:'200px',sb:1,cw:{}},
           sale:{...DEF_LAY,cw:{}},
           plan:{...DEF_LAY,pad:5,rowh:21,cw:{}}};
/** 字級＝列高等比縮放（列高 22 → 11.5px）再乘微調倍率 */
const fsOf=l=>clamp(11.5*(l.rowh/22)*(l.fs/100),8.5,22);
function applyLayout(tab){
  const l=LAY[tab]||DEF_LAY, s=document.documentElement.style;
  s.setProperty('--cell-pad',l.pad+'px');
  s.setProperty('--rowh',l.rowh+'px');
  s.setProperty('--cell-fs',fsOf(l).toFixed(2)+'px');
  if(l.aw)s.setProperty('--aside-w',l.aw);
  if(tab==='flow'&&l.ch)s.setProperty('--chart-h',l.ch);
  // 側邊欄：流量分析／銷售分析都要（第 11 項）；決策頁沒有分類篩選 → 隱藏
  const wantSb = (tab!=='plan') && (LAY.flow.sb!==0);
  $('applayout').classList.toggle('nosb',!wantSb);
}
/* ⭐⭐⭐ **使用者存的「全站預設」是唯一真相，改版不可以把它蓋回程式碼裡的預設值**
   （2026-08-05 使用者明確要求，說已經被弄掉好幾次）。

   以前為什麼會被弄掉：設定是用「**索引陣列**」存的（`COLS.map(c=>c.on)`），還原時
   `defs.forEach((x,i)=>x.on=arr[i])` 依索引對回去。只要我在欄位清單**中間插入或刪掉**
   一個欄位，之後所有欄位就整排錯位——使用者看到的就是「我設好的又被改回預設了」。

   ⇒ 改成 **key→值 的物件**（每個欄位本來就有唯一的 `k`）。這樣以後不管怎麼
     增加、刪除、調換欄位順序，已存的設定都還是套到正確的欄位上。
   ⇒ 舊的陣列格式仍讀得懂（`put()` 會自動辨識），使用者不用重存。 */
const onMap=defs=>Object.fromEntries(defs.map(d=>[d.k,d.on?1:0]));
function curCfg(){
  return {v:3,
    flow:{cols:onMap(COLS),stats:onMap(STATS),lay:{...LAY.flow}},
    plan:{cols:onMap(PCOLS),lay:{...LAY.plan},sp:{...SP}},
    sale:{lay:{...LAY.sale}}};
}
function applyCfg(c){
  if(!c)return;
  if(!c.v){                                   // v1 舊格式（只有流量分析頁）→ 搬進 flow
    c={v:2,flow:{cols:c.cols,stats:c.stats,
      lay:{...DEF_LAY,aw:c.aw,ch:c.ch,sb:c.sb}}};
  }
  // v3＝{k:on} 物件（不怕欄位增刪）；v1/v2＝索引陣列（舊資料，依索引還原）
  const put=(defs,saved)=>{
    if(!saved)return;
    if(Array.isArray(saved)) defs.forEach((x,i)=>{if(!x.lock&&saved[i]!==undefined)x.on=saved[i];});
    else defs.forEach(x=>{if(!x.lock&&saved[x.k]!==undefined)x.on=saved[x.k];});
  };
  if(c.flow){ put(COLS,c.flow.cols); put(STATS,c.flow.stats);
    if(c.flow.lay)Object.assign(LAY.flow,c.flow.lay); }
  if(c.plan){ put(PCOLS,c.plan.cols);
    if(c.plan.lay)Object.assign(LAY.plan,c.plan.lay);
    if(c.plan.sp)Object.assign(SP,c.plan.sp); }
  if(c.sale&&c.sale.lay)Object.assign(LAY.sale,c.sale.lay);
  applyLayout(TAB);
}
function saveCfg(){ try{localStorage.setItem(CFGKEY,JSON.stringify(curCfg()));}catch(e){} }
function loadCfg(){
  try{
    const raw=localStorage.getItem(CFGKEY)||localStorage.getItem('tmsflow.cfg.v1');
    applyCfg(JSON.parse(raw||'null'));
  }catch(e){}
}

/* ---------- 載入 ---------- */
async function boot(){
  const emb=$('embedded'), embM=$('embedded-master'), embP=$('embedded-plan');

      if(embP)PLAN=JSON.parse(embP.textContent);
    }else if(API_URL){                          // ② 正式版：向 GAS 取（資料留在 Google）
      say('連線後端取得資料中…');
      DATA=await getPart('traffic',say);
      say('主檔載入中…');
      try{ MASTER=(await getPart('master')).items||{}; }catch(e){ console.warn('master',e); }
      try{ PLAN=await getPart('plan'); }catch(e){ console.warn('plan',e); }
      // ⚠️ 月庫**不在開站時載**（2026-08-12）：它 1.7 MB 但後端要 30~60 秒才回，
      //   放在這裡等於整個網站都被它卡住。改成切到「月」顆粒時才載（見 ensureMonthly）。
    }else{                                      // ③ 本機開發：直接讀同目錄 JSON
      const [a,b,c,d]=await Promise.all([fetch('traffic.json?_='+Date.now()),
        fetch('master.json?_='+Date.now()).catch(()=>null),
        fetch('plan.json?_='+Date.now()).catch(()=>null),
        fetch('monthly.json?_='+Date.now()).catch(()=>null)]);
      if(!a.ok)throw new Error('traffic.json HTTP '+a.status);
      DATA=await a.json();
      if(b&&b.ok){ try{MASTER=(await b.json()).items||{};}catch(e){} }
      if(c&&c.ok){ try{PLAN=await c.json();}catch(e){} }
      if(d&&d.ok){ try{MONTHLY=await d.json();}catch(e){} }
    }
  }catch(e){ return fail('讀不到資料：'+esc(e.message)+
    '<br>本機開發請透過網址開啟（不是雙擊檔案）；離線請改用單檔版。'); }
  DAILY=DATA;                                   // 日庫留一份，切「月」時要換回來

    MONTHLY&&MONTHLY.meta&&MONTHLY.meta.months
      ? `月＝讀月庫（${MONTHLY.meta.months[0]} 起共 ${MONTHLY.meta.months.length} 個月）`
      : '月＝讀月庫（2024-01 起）；第一次切過去要等 30~60 秒載入';
  if(API_URL&&!emb)loadGlobalCfg();             // 全站設定（後端）覆蓋本機設定
}
const fail=m=>{ $('err').innerHTML='<div class="err">'+m+'</div>'; $('tb').innerHTML=''; };

/* ---------- 前置：合併主檔（成本／售價／毛利／改價時間一律以商品總檔為準） ---------- */
function prep(){
  const D=DATA.meta.dates,nd=D.length;
  R={a:0,b:nd-1};
  // ★ 月模式：期間選擇器改成「年月」（input[type=month] 的值格式剛好就是 YYYY-MM）
  const mm=!!DATA.meta.monthMode;
  $('d1').type=$('d2').type = mm?'month':'date';
  $('d1').min=$('d2').min=D[0]; $('d1').max=$('d2').max=D[nd-1];
  $('d1').value=D[0]; $('d2').value=D[nd-1];
  const hit=DATA.products.filter(p=>MASTER[p.c]).length;
  // meta.finalized（ERP 端在 22:00 之後才會把當天標成定稿，見 A8）
  const fin=(DATA.meta.finalized&&Object.keys(DATA.meta.finalized))||[];
  const todayFinal=fin.includes(D[nd-1]);
  const noPI=DATA.products.filter(p=>!(MASTER[p.c]||{}).PI).length;
  $('meta').innerHTML=`資料 <b>${D[0]}</b>~<b>${D[nd-1]}</b>（${nd}${mm?' 個月':'天'}）　`+
    `產品 <b>${DATA.products.length.toLocaleString()}</b>　`+
    `主檔 <b>${hit.toLocaleString()}</b>　匯入 <b>${esc((DATA.meta.exported||'—').slice(0,16))}</b>`+
    (fin.length?`　定稿 <b>${fin.length}</b> 天`+
      (todayFinal?'':`<span style="color:var(--warn)">（最後一天還沒定稿，${
        esc(DATA.meta.finalAfter||'22:00')} 之後才是最終值）</span>`):'')+
    // 售價固定用 PI（A4）→ PI 空白的品項算不出銷貨額，明講出來不要讓人以為是 bug
    (noPI?`　<span style="color:var(--warn)" title="售價一律用商品總檔的 PI（使用者指定）；PI 空白就沒有售價，銷貨額與毛利率會是空的">`
      +`PI 空白 <b>${noPI.toLocaleString()}</b> 項</span>`:'');
  ROWS=DATA.products.map(p=>{
    const m=MASTER[p.c]||{};
    const cost=m.cost||p.cost||0;
    // A4：售價一律用 **PI**（使用者指定）。實查主檔：PI 有值 3,419 筆、BEST 3,353 筆，
    //     而且沒有「BEST 有值但 PI 空白」的情形 → 固定用 PI 不會少算。
    const unit=m.PI||0;
    return {...p,
      vendor:m.vendor||'', cost, unit, repriced:m.repriced||'',
      // A4：毛利率＝(PI − 含稅成本) ÷ PI。主檔那個「毛利」欄不用了（多半空白且算法不明）
      gp: unit>0 ? (unit-cost)/unit : 0,
      pPI:m.PI||0, pBEST:m.BEST||0, pSH:m.SH||0, 'pMO+':m['MO+']||0, pSP:m.sp||0};
  });
  recalc();
}
/** 依目前日期範圍重算每個產品的指標 */
function recalc(){
  const {a,b}=R, span=b-a+1, from14=Math.max(a,b-13);
  ROWS.forEach(p=>{
    let tin=0,tsale=0,tret=0,oos=0,active=0,d14=0;
    const stock=[],sale=[],buy=[];
    for(let i=a;i<=b;i++){
      const st=p.d[i*4],ci=p.d[i*4+1],cs=p.d[i*4+2],cr=p.d[i*4+3];
      stock.push(st);sale.push(cs);buy.push(ci);
      tin+=ci;tsale+=cs;tret+=cr;
      if(i>=from14)d14+=cs;
      if(st<=0)oos++; else if(cs>0)active++;
    }
    const valid=span-oos, avg=valid>0?tsale/valid:0, last=stock[stock.length-1];
    Object.assign(p,{tin,tsale,tret,oos,active,d14,valid,avg,last,stock,sale,buy,
      mavg:avg*30,                    // A5：月均銷
      open0:p.d[a*4], amt:tsale*p.unit, cogs:tsale*p.cost,
      days:avg>0?last/avg:(last>0?Infinity:0)});
  });
}

/** 側邊欄三個分類清單的高度分配（2026-08-05 使用者指定）。
    規則＝「**下一步要選哪一層，那一層就全部列出**」：
      沒選大類 → 焦點是大類（中/小類本來就不顯示）
      選了大類、還沒選中類 → 焦點是中類，大類讓位
      選了中類 → 焦點是小類，其次留給中類，**大類縮到最小**
    按「全部」＝退一步：F.g1 或 F.g2 被清成 ''，焦點自然回到上一層（不必另外寫）。
    ⚠ 小類清單不存在時（該中類沒有小類），焦點退回中類，否則會把空間給一個隱藏的區塊。 */
function layoutSecs(){
  const has3=!$('sec3').classList.contains('hide');
  const focus = F.g1==='' ? 1 : (F.g2==='' ? 2 : (has3?3:2));
  [['sec1',1],['sec2',2],['sec3',3]].forEach(([id,lv])=>{
    const el=$(id); if(!el) return;
    el.classList.remove('pri1','pri2','pri3');
    // 離焦點越遠 → 優先度越低（pri3 最先被壓縮）
    el.classList.add('pri'+Math.min(3,1+Math.abs(focus-lv)));
  });
  armSelWatch();
  // 多重時機補校：ResizeObserver 大部分情況會接住，但「大類 580px→63px」這種一次
  // 縮很多的轉換實測會漏（2026-08-05）。這幾次呼叫都是冪等的（看得到就直接 return），
  // 成本可以忽略，換到「不管哪種切換都一定捲得到選中項」。
  keepSelVisible();
  setTimeout(keepSelVisible, 0);
  setTimeout(keepSelVisible, 160);
}
/** 讓位縮小之後，**目前選的那一項要還看得見**（不然只剩一兩行，使用者不知道自己選了什麼）。
    ⚠️ 不可以用 `sel.offsetTop`——`.rlist` 沒有 position:relative，`offsetParent` 是 `aside`，
       量到的是「相對側邊欄」的距離，基準錯了會捲到別的地方（2026-08-05 實測）。
       用 getBoundingClientRect 算**相對位移**，不管 offsetParent 是誰都正確。 */
function keepSelVisible(){
  ['f1','f2','f3'].forEach(b=>{
    const rl=$(b), sel=rl&&rl.querySelector('label.sel');
    if(!rl||!sel||rl.scrollHeight<=rl.clientHeight) return;
    // ★ 被壓到只剩一兩行時，改成捲到最上面顯示 **【全部】**（＝返回上一層的入口）。
    //   2026-08-06 使用者：「如果空間不夠，大類列出【全部】的選項就好，等於是返回的意思」。
    //   那麼小的空間裡「能不能退回去」比「現在選了什麼」有用——選了什麼在下一層與圖表標題都看得到。
    if(rl.clientHeight < sel.offsetHeight*2.5){ rl.scrollTop=0; return; }
    const a=sel.getBoundingClientRect(), r=rl.getBoundingClientRect();
    if(a.top>=r.top-1 && a.bottom<=r.bottom+1) return;        // 已經看得到就別亂捲
    rl.scrollTop = Math.max(0, rl.scrollTop + (a.top-r.top) - (r.height-a.height)/2);
  });
}
/** ⚠️⚠️ 為什麼要用 ResizeObserver 而不是 rAF：改完 class 之後**當下量到的還是舊高度**，
    兩層 rAF 也一樣（2026-08-05 實測：大類清單那時仍是 580px，公式算出負值被 max(0) 夾成 0
    → 看起來像「捲動沒生效」）。改成**尺寸真的變了才校正**，就不用猜時機。 */
let _selWatch=null;
function armSelWatch(){
  if(_selWatch||!window.ResizeObserver) return;
  _selWatch=new ResizeObserver(()=>keepSelVisible());
  ['f1','f2','f3'].forEach(b=>$(b)&&_selWatch.observe($(b)));
}

function syncSub(){

/* ---------- 時間桶 ---------- */
function buckets(){
  const D=DATA.meta.dates.slice(R.a,R.b+1);
  if(GRAN==='d')return D.map((d,i)=>({label:d.slice(5).replace('-','/'),full:d,idx:[i]}));
  const m=new Map();
  D.forEach((d,i)=>{
    let key,label;
    if(GRAN==='m'){key=d.slice(0,7);label=key.replace('-','/');}
    else{const dt=new Date(d+'T00:00:00'),off=(dt.getDay()+6)%7,mo=new Date(dt);
      mo.setDate(dt.getDate()-off);key=mo.toISOString().slice(0,10);label=key.slice(5).replace('-','/');}
    if(!m.has(key))m.set(key,{label,full:key,idx:[]});
    m.get(key).idx.push(i);
  });
  return [...m.values()];
}

/* ---------- 主流程 ---------- */
function render(){
  const q=(F.q||'').trim().toLowerCase();     // 搜尋字串也是每個分頁各自記一份
  VIEW=ROWS.filter(p=>{
    if(F.g1!==''&&p.g1!=F.g1)return false;
    if(F.g2!==''&&p.g2!=F.g2)return false;
    if(F.g3!==''&&p.g3!==F.g3)return false;
    if($('hideZero').checked&&!p.tin&&!p.tsale&&!p.tret&&!p.last)return false;
    if(q&&!(p.c.toLowerCase().includes(q)||p.n.toLowerCase().includes(q)))return false;
    return true;
  });
  const k=SORT.k;
  VIEW.sort((a,b)=>{let x=a[k],y=b[k];
    if(typeof x==='string')return SORT.d*String(x).localeCompare(String(y));
    if(x===Infinity)x=9e15;if(y===Infinity)y=9e15;return SORT.d*((x||0)-(y||0));});
  drawStats(VIEW);drawChart();drawTable();
}
const drawStats=v=>{
  $('stats').innerHTML=STATS.filter(s=>s.on).map(s=>
    `<div class="stat"><div class="k">${esc(s.t)}</div><div class="v ${s.cls}">${s.f(v)}</div></div>`).join('');
  syncStatsH();          // 勾選的統計項變了→高度可能變（會換行）→ 表頭的讓位要跟著更新

/* ---------- 圖表 ---------- */
function drawChart(){
  // ★ 2026-08-05 使用者：「拖曳多選的時候，上面的報表也要一起更新」
  //   優先序：單擊看單品(PICK) → 拖曳多選(SEL) → 目前篩選(VIEW)
  const B=buckets();
  const msel=SEL.size?ROWS.filter(p=>SEL.has(p.c)):null;
  const src=PICK?[PICK]:(msel||VIEW);
  $('chartTitle').textContent=(PICK?`${PICK.c}　${PICK.n}`:
    (msel?`選取的 ${msel.length.toLocaleString()} 項`:
    (F.g3!==''?F.g3:F.g2!==''?midName(F.g1,+F.g2):F.g1!==''?DATA.meta.cats[F.g1]:'全部類別')))
    +(PICK||msel?'':`　（${src.length.toLocaleString()} 項）`);
  $('btnClear').style.display=PICK?'':'none';

  const sale=[],buy=[],stock=[];
  B.forEach(b=>{let s=0,i2=0,st=0;
    src.forEach(p=>{b.idx.forEach(i=>{s+=p.sale[i];i2+=p.buy[i];});st+=p.stock[b.idx[b.idx.length-1]];});
    sale.push(s);buy.push(i2);stock.push(st);});

  const show={sale:$('sSale').checked,buy:$('sBuy').checked,stock:$('sStock').checked};
  const H=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--chart-h'))||200;
  const W=Math.max(320,$('cwrap').clientWidth-4);      // ★ 一律等於容器寬，不再撐出橫向捲軸
  const PL=52,PR=show.stock&&(show.sale||show.buy)?46:14,PT=12,PB=24;
  const iw=W-PL-PR,ih=H-PT-PB, xs=i=>PL+(B.length===1?iw/2:i*(iw/(B.length-1)));
  const maxL=Math.max(1,...(show.sale?sale:[]),...(show.buy?buy:[])), maxR=Math.max(1,...stock);
  const yL=v=>PT+ih-(v/maxL)*ih, yR=v=>PT+ih-(v/maxR)*ih;

  let g='';
  for(let i=0;i<=4;i++){
    const y=PT+ih*(i/4);
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--line)" ${i<4?'stroke-dasharray="2,3"':''}/>`
     +`<text x="${PL-6}" y="${y+3.5}" font-size="10" fill="var(--muted)" text-anchor="end">${N(maxL*(1-i/4))||0}</text>`;
    if(show.stock&&(show.sale||show.buy))
      g+=`<text x="${W-PR+6}" y="${y+3.5}" font-size="10" fill="var(--stock)">${N(maxR*(1-i/4))||0}</text>`;
  }
  const step=Math.max(1,Math.ceil(B.length/(GRAN==='d'?Math.max(6,Math.floor(iw/64)):24)));
  B.forEach((b,i)=>{if(i%step===0||i===B.length-1)
    g+=`<text x="${xs(i)}" y="${H-7}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(b.label)}</text>`;});

  // 改價點（單品才畫，來自商品總檔的改價時間）
  if($('sMark').checked&&PICK&&PICK.repriced){
    const day=PICK.repriced.slice(0,10);
    const bi=B.findIndex(b=>b.idx.some(i=>DATA.meta.dates[R.a+i]===day));
    if(bi>=0)g+=`<line x1="${xs(bi)}" y1="${PT}" x2="${xs(bi)}" y2="${PT+ih}" stroke="var(--price)"
      stroke-width="1.6" stroke-dasharray="4,3"/><text x="${xs(bi)+3}" y="${PT+10}" font-size="10"
      fill="var(--price)">改價 ${esc(day.slice(5))}</text>`;
  }
  const poly=(a,fy,c,w)=>`<polyline points="${a.map((v,i)=>xs(i)+','+fy(v)).join(' ')}" fill="none"
      stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`;
  const dots=(a,fy,c)=>a.map((v,i)=>`<circle cx="${xs(i)}" cy="${fy(v)}" r="2.5" fill="${c}"/>`).join('');
  if(show.stock)g+=poly(stock,yR,'var(--stock)',1.6)+dots(stock,yR,'var(--stock)');
  if(show.buy)  g+=poly(buy,yL,'var(--buy)',1.8)+dots(buy,yL,'var(--buy)');
  if(show.sale) g+=poly(sale,yL,'var(--sale)',2.1)+dots(sale,yL,'var(--sale)')
    +sale.map((v,i)=>v&&(B.length<=32||i%step===0)?`<text x="${xs(i)}" y="${yL(v)-7}" font-size="9.5"
      fill="var(--sale)" text-anchor="middle">${N(v)}</text>`:'').join('');

  const hz=B.map((b,i)=>{const w=iw/B.length;
    return `<rect x="${(xs(i)-w/2).toFixed(1)}" y="${PT}" width="${w.toFixed(1)}" height="${ih}"
      fill="transparent" data-i="${i}"/>`;}).join('');
  const svg=$('chart');
  svg.setAttribute('width',W);svg.setAttribute('height',H);

function hover(svg,tip,wrap,html){
  svg.onmousemove=e=>{
    const t=e.target.dataset&&e.target.dataset.i;
    if(t===undefined){tip.style.display='none';return;}
    tip.innerHTML=html(+t); tip.style.display='block';
    const box=wrap.getBoundingClientRect();
    let L=e.clientX-box.left+wrap.scrollLeft+12;
    if(L+160>box.width+wrap.scrollLeft)L-=180;
    tip.style.left=L+'px'; tip.style.top=(e.clientY-box.top+14)+'px';
  };
  svg.onmouseleave=()=>tip.style.display='none';
}

   ========================================================================= */
const SEL=new Set();          // 分頁1 選取的產品代號
const PSEL=new Set();         // 分頁3 選取的試算表列號
function mkDragSelect(tbody, keyOf, selSet, onDone){
  let anchor=null, moved=false, active=false;
  const rowOf=e=>e.target.closest('tr[data-k]');
  const idxOf=tr=>[...tbody.querySelectorAll('tr[data-k]')].indexOf(tr);
  const mark=()=>tbody.querySelectorAll('tr[data-k]').forEach(tr=>
    tr.classList.toggle('msel',selSet.has(tr.dataset.k)));
  const range=(i,j)=>{
    const list=[...tbody.querySelectorAll('tr[data-k]')];
    for(let k=Math.min(i,j);k<=Math.max(i,j);k++)selSet.add(list[k].dataset.k);
  };
  tbody.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    if(e.target.closest('input,select,button,a'))return;
    const tr=rowOf(e); if(!tr)return;
    active=true; moved=false; anchor=idxOf(tr);
    if(e.shiftKey&&selSet.size){ const list=[...tbody.querySelectorAll('tr[data-k]')];
      const last=list.findIndex(x=>selSet.has(x.dataset.k));
      range(last<0?anchor:last,anchor); moved=true; mark(); onDone(); e.preventDefault(); return; }
    if(e.ctrlKey||e.metaKey){ const k=tr.dataset.k;
      selSet.has(k)?selSet.delete(k):selSet.add(k); moved=true; mark(); onDone();
      e.preventDefault(); return; }
    document.body.classList.add('dragging');
    e.preventDefault();
  });
  tbody.addEventListener('mouseover',e=>{
    if(!active||anchor===null)return;
    const tr=rowOf(e); if(!tr)return;
    const i=idxOf(tr);
    if(i!==anchor&&!moved){ moved=true; selSet.clear(); }
    if(moved){ selSet.clear(); range(anchor,i); mark(); onDone(); }
  });
  addEventListener('mouseup',e=>{
    if(!active)return;
    active=false; document.body.classList.remove('dragging');
    const tr=e.target.closest&&e.target.closest('tr[data-k]');
    if(!moved&&tr&&tbody.contains(tr)){        // 沒拖曳＝單擊 → 交給原本的行為（看圖）
      selSet.clear(); mark(); onDone(); keyOf(tr.dataset.k);
    }
    anchor=null;
  });
  return mark;
}

/* 改價成效：**扣掉缺貨日**才準（跟蝦皮專案 price_analyze_run.py 的做法一致）。
   缺貨門檻依日均銷量線性內插：日均≤1 → 庫存<1 算缺貨；日均≥10 → 庫存<10 算缺貨。 */
const oosThr=avg=>avg<=1?1:avg>=10?10:1+((avg-1)/9)*9;
function saleReprice(v){
  const D=DATA.meta.dates, WIN=14;
  const list=v.filter(p=>p.repriced).map(p=>{
    const di=D.indexOf(p.repriced.slice(0,10));
    if(di<0)return null;
    const lo=Math.max(R.a,di-WIN), hi=Math.min(R.b,di+WIN);
    let samp=0,sn=0;
    for(let i=lo;i<=hi;i++)if(p.d[i*4]>0){samp+=p.d[i*4+2];sn++;}
    const thr=oosThr(sn?samp/sn:0);
    let bs=0,bn=0,bo=0,as=0,an=0,ao=0;
    for(let i=lo;i<di;i++){ if(p.d[i*4]<thr){bo++;continue;} bs+=p.d[i*4+2];bn++; }
    for(let i=di;i<=hi;i++){ if(p.d[i*4]<thr){ao++;continue;} as+=p.d[i*4+2];an++; }
    if(!bn&&!an)return null;
    const b=bn?bs/bn:0,a=an?as/an:0;
    const bad=(bn<WIN*0.8)||(an<WIN*0.8);
    return {...p,rb:b,ra:a,bn,an,bo,ao,thr,bad,
      chg:b>0?(a-b)/b:(a>0?1:0),di};
  }).filter(Boolean).sort((x,y)=>y.chg-x.chg);
  saleTable([['產品代號','l'],['品名','l'],['改價日','l'],['前日均',''],['後日均',''],
             ['變化',''],['可比天數','l'],['目前庫存',''],['售價PI','']],
    list.slice(0,200).map(p=>{
      const up=p.chg>0.05,dn=p.chg<-0.05;
      return `<tr><td class="l code"><span>${esc(p.c)}</span></td>
      <td class="l"><span class="nm" title="${esc(p.n)}">${esc(p.n)}</span></td>
      <td class="l dim">${esc(p.repriced.slice(0,10))}</td>
      <td>${p.rb.toFixed(2)}</td><td>${p.ra.toFixed(2)}</td>
      <td><span class="tag ${p.bad?'t-warn':up?'t-ok':dn?'t-bad':'t-cool'}">${
        p.bad?'🟡數據不足':(p.chg>0?'▲':p.chg<0?'▼':'')+(p.chg*100).toFixed(0)+'%'}</span></td>
      <td class="l dim" style="font-size:10.5px">前${p.bn}／後${p.an} 天${
        (p.bo||p.ao)?`（缺 前${p.bo}後${p.ao}）`:''}</td>
      <td>${N(p.last)}</td><td>${N(p.pPI)}</td></tr>`;}),
    `改價日取自商品總檔「已完成上架」A 欄；比較改價前後各 ${WIN} 天的日均銷量，`+
    `**扣掉缺貨日**（庫存低於門檻的那幾天不算），前後可比天數不足 8 成標「數據不足」`);
  $('cnt2').textContent=`有改價紀錄且可比較：${list.length} 項`;
  $('saleNote').innerHTML='回填商品觀察區 <b>Z~AH</b> 由開發機的 '+
    '<code>reprice_writeback.py</code> 執行（沿用蝦皮專案 v8.4 演算法、寫入前先備份、只補空白列）'+
    '；網站這一頁是快速瀏覽用。';
}

const SP={

  sporadic:1, sporadicDays:2,     // ❌ 暫緩進貨（30 天只賣 ≤N 天）
  longtail:1, longtailDays:10,    // ℹ️ 長尾常態品（90 天有賣 ≥N 天就放行）
  warm:1, warmK:85, warmGap:5,    // 🌱 斷貨回溫（有庫存沒賣 >N 天 → 用長線 ×K%）
  spike:1, spikeTh:40,            // 📈 暴漲平滑（趨勢 ≥N% → 取 30/90 平均）
  damage:1, damageK:80, damageOos:10, // ⚠️ 權重受損（缺貨 >N 天 → 消耗 ×K%）
  cycle:1, cycleK:130, cycleWaves:2,  // 🔥 循環斷貨加碼（斷貨波次 ≥N → ×K%）
  cap:1,                          // 🛑 終極防爆（裁到庫存上限）
  fallback:1,                     // 備援：算不出來就讀試算表 S 欄「單日銷售」
};
const SPDEF=[
  ['frozen','❄️ 銷量結凍',[]],
  ['sporadic','❌ 暫緩進貨(偶發)',[['sporadicDays','30天賣≤','天',1,10]]],
  ['longtail','ℹ️ 長尾常態品放行',[['longtailDays','90天賣≥','天',1,60]]],
  ['warm','🌱 斷貨回溫校正',[['warmGap','有庫存沒賣>','天',0,30],['warmK','長線×','%',10,200]]],
  ['spike','📈 暴漲平滑',[['spikeTh','趨勢≥','%',5,300]]],
  ['damage','⚠️ 權重受損',[['damageOos','缺貨>','天',0,60],['damageK','消耗×','%',10,150]]],
  ['cycle','🔥 循環斷貨加碼',[['cycleWaves','波次≥','次',1,10],['cycleK','應補×','%',100,300]]],
  ['cap','🛑 終極防爆(裁到上限)',[]],
  ['fallback','↩︎ 備援：讀原表單日銷售',[]],
];
function buildSpBox(){
  $('spbox').innerHTML=SPDEF.map(([k,label,nums])=>
    `<span class="spitem"><label><input type="checkbox" data-sp="${k}" ${SP[k]?'checked':''}> ${label}</label>`
    +nums.map(([nk,pre,suf,mn,mx])=>
      `<span class="k" style="color:var(--muted)">${pre}</span>`
      +`<input type="number" data-sp="${nk}" value="${SP[nk]}" min="${mn}" max="${mx}">`
      +`<span class="k" style="color:var(--muted)">${suf}</span>`).join('')
    +`</span>`).join('');
  $('spbox').querySelectorAll('[data-sp]').forEach(el=>{
    const h=deb(()=>{ SP[el.dataset.sp]=el.type==='checkbox'?(el.checked?1:0):(+el.value||0);
      saveCfg(); runPlan(); },200);
    el.type==='checkbox'?el.onchange=h:el.oninput=h;
  });
}

/** 依「試算表原始列序」組出要貼回 AR:AU 的四欄（含空白列，才對得齊）
 *  forWrite=true（一鍵回填用）→ **每一列都輸出**（沒建議的寫空白，含「關閉」的列），
 *    這樣 GAS 端可以整段一次寫進 AR2:AU<最後一列>，不會留下上一輪的殘值。
 *  forWrite=false（複製貼上用）→ 沿用畫面上「關閉也輸出空白列」那個勾選。 */
function planOut(forWrite){
  const map=new Map(PLANROWS.map(r=>[r.row,r]));
  const out=[];
  PLAN.items.forEach(it=>{
    const r=map.get(it.row);
    if(!r){
      const closed=(it.remark||'').includes('關閉');
      if(!closed||forWrite||PLANMETA.keepClosed)out.push({row:it.row,v:['','','','']});
      return;
    }
    // ★ 負數一律 0（B7）：訂貨量不可能是負的
    const q=Math.max(0,Math.round(r.order||0));
    out.push({row:it.row,v:[(r.suitable&&q>0)?q:'',r.status,r.strategy,r.c]});
  });
  return out;
}
function buildClip(){
  const out=planOut(false);
  CLIP=out.map(o=>o.v.join('\t')).join('\n');
  return out.length;
}

function runPlan(){
  if(!PLAN||!PLAN.items){ $('tb3').innerHTML='<tr><td class="empty">讀不到 plan.json（345庫存規劃）</td></tr>'; return; }
  if(!$('spbox').innerHTML)buildSpBox();
  const ltSea=+$('ltSea').value||50, ltFast=+$('ltFast').value||30, ltQiao=+$('ltQiao').value||14;
  const ltOther=+$('ltOther').value||15;
  const maxDaysLimit=+$('maxDays').value||90, fallbackSafety=+$('safeDays').value||0;
  const keepClosed=$('keepClosed').checked;
  const D=DATA.meta.dates, nd=D.length;
  const tmap=new Map(DATA.products.map(p=>[p.c,p]));
  const i30=[],i90=[];
  for(let i=Math.max(0,nd-30);i<nd;i++)i30.push(i);
  for(let i=Math.max(0,nd-90);i<nd;i++)i90.push(i);

  const rows=[];
  let closed=0, noTraffic=0;

  PLAN.items.forEach(it=>{
    if((it.remark||'').includes('關閉')){ closed++; return; }
    if(!it.c){ return; }

    const tr=tmap.get(it.c);
    if(!tr)noTraffic++;
    const stockAt=i=>tr?tr.d[i*4]:0, saleAt=i=>tr?tr.d[i*4+2]:0;

    const currentStock=it.qty, inTransit=it.o1+it.o2+it.o3, totalAvailable=currentStock+inTransit;
    const itemSafetyDays=it.safe||fallbackSafety;

    // 物流別 → 前置期（PEND.ship 有改過就用改過的）
    const shipRaw=(PEND.ship[it.row]!==undefined?PEND.ship[it.row]:(it.ship||''));
    const first=shipRaw.split('/')[0].split('、')[0];
    let activeLT=ltOther, logi='無標記';
    if(first.includes('海快')){activeLT=ltFast;logi='海快';}
    else if(first.includes('海運')){activeLT=ltSea;logi='海運';}
    else if(first.includes('巧巧郎')||first.includes('巧郎')){activeLT=ltQiao;logi='巧巧郎';}
    else if(first){logi=first;}

    // 近 30 天
    let valid30=0,sales30=0,oos30=0,noSale30=0,saleDays30=0;
    i30.forEach(i=>{const st=stockAt(i),cs=saleAt(i);
      if(st<=0)oos30++; else{valid30++;sales30+=cs;cs>0?saleDays30++:noSale30++;}});
    const d30=valid30>0?sales30/valid30:0;
    // 近 90 天（含斷貨波次）
    let valid90=0,sales90=0,saleDays90=0,waves=0,inStock=true;
    i90.forEach(i=>{const st=stockAt(i),cs=saleAt(i);
      if(st>0){valid90++;sales90+=cs;if(cs>0)saleDays90++;inStock=true;}
      else if(inStock){waves++;inStock=false;}});
    const d90=valid90>0?sales90/valid90:0;
    const trend=d90>0?((d30-d90)/d90)*100:0;

    // ---- 進貨適性（策略可開關） ----
    let suitable=true, final=d30, txt='', warm=false, spike=false;
    const longTail=SP.longtail&&(sales30>0&&saleDays30<=SP.sporadicDays&&saleDays90>=SP.longtailDays);
    if(SP.frozen&&sales30===0&&currentStock>0){ final=0; txt+='[❄️銷量結凍] '; }
    if(SP.sporadic&&sales30>0&&saleDays30<=SP.sporadicDays){
      if(!longTail){ suitable=false; final=0; txt+='[❌暫緩進貨(偶發)] '; }
      else txt+='[ℹ️長尾常態品] ';
    }
    // 互斥策略一：斷貨回溫 / 暴漲平滑
    if(SP.warm&&sales30>0&&noSale30>SP.warmGap&&d90>final){
      if(!longTail&&trend>=-50){ final=d90*(SP.warmK/100); warm=true; txt+='[🌱斷貨回溫校正] '; }
    }else if(SP.spike&&sales30>0&&trend>=SP.spikeTh&&d90>0){
      final=(d30+d90)/2; spike=true; txt+='[📈暴漲平滑] ';
    }
    if(oos30>0)txt+=`[缺貨:${oos30}天] `;
    if(noSale30>0)txt+=`[有庫存無銷售:${noSale30}天] `;
    // 流量表算不出來 → 退回試算表自己的「單日銷售」
    let formula = final>0?`${sales30}÷${valid30}天`:'—';
    if(SP.fallback&&final===0&&sales30>0&&suitable&&it.daily>0){ final=it.daily; formula=`直讀原表 ${it.daily}`; }
    if(warm)formula=`長線 ${d90.toFixed(1)}×${SP.warmK}%`;
    if(spike)formula='30/90天平均';

    // ---- 需求預算 ----
    let consume=final*activeLT;
    if(SP.damage&&suitable&&oos30>SP.damageOos&&consume>0){
      consume*=(SP.damageK/100); txt+=`[⚠️權重受損x${(SP.damageK/100).toFixed(2)}] `; }
    const safety=final*itemSafetyDays, cap=final*maxDaysLimit;
    const target=Math.min(consume+safety,cap);
    let order=suitable?Math.ceil(target-totalAvailable):0;
    // 互斥策略二：循環斷貨加碼
    if(SP.cycle&&suitable&&waves>=SP.cycleWaves&&order>0&&!longTail&&trend>=-50){
      order=Math.ceil(order*(SP.cycleK/100)); txt+=`[🔥循環斷貨x${(SP.cycleK/100).toFixed(2)}] `;
    }
    // 終極防爆：不得穿透 maxDays 天上限
    if(SP.cap&&suitable&&(totalAvailable+order)>cap){
      const o0=order; order=Math.max(0,Math.ceil(cap-totalAvailable));
      if(order<o0)txt+='[🛑終極防爆] ';
    }
    order=Math.max(0,order);         // ★ 負數一律 0（B7）
    // 趨勢標籤（放最前，同 V4.12）
    let trendTag = d90>0 ? (trend>5?`▲暴漲+${trend.toFixed(0)}%`:trend<-5?`▼放緩${trend.toFixed(0)}%`:`持平${trend.toFixed(0)}%`)
                         : (d30>0?'▲新爆發':'無數據');
    const strategy=(trendTag+' '+txt).trim();

    // 狀態燈號
    let status='🟢 庫存健康';
    if(final===0&&totalAvailable>0&&suitable)status='🟣 滯銷積壓';
    else if(!suitable)status='⚪ 觀察暫緩';
    else if(totalAvailable>cap&&final>0)status='🟣 庫存超標';
    else if(totalAvailable<=consume&&final>0)status='🔴 緊急補貨';
    else if(order>0)status='🟡 建議下單';

    const boxn=(PEND.boxn[it.row]!==undefined?PEND.boxn[it.row]:it.boxn);
    rows.push({...it,ship:shipRaw,boxn,logi,activeLT,currentStock,inTransit,totalAvailable,
      itemSafetyDays,d30,d90,trend,final,formula,consume,safety,target,order,status,strategy,suitable,
      order0:order,                       // 系統原始建議（改過之後還能對照）
      boxes:(boxn>0&&order>0)?order/boxn:0,
      days:final>0?totalAvailable/final:(totalAvailable>0?Infinity:0),hasTraffic:!!tr});
  });

  PLANROWS=rows;
  PLANMETA={keepClosed, nd, closed, noTraffic};
  drawPlan();
}

/** 數值篩選語法：`>100` `<10` `>=5` `<=5` `=0` `10-20`，純數字＝等於 */
function numMatch(v,expr){
  const s=String(expr||'').trim();
  if(!s)return true;
  const v2=+v||0;
  let m=s.match(/^(>=|<=|>|<|=)\s*(-?[\d.]+)$/);
  if(m){const n=+m[2];
    return m[1]==='>'?v2>n:m[1]==='<'?v2<n:m[1]==='>='?v2>=n:m[1]==='<='?v2<=n:v2===n;}
  m=s.match(/^(-?[\d.]+)\s*[-~]\s*(-?[\d.]+)$/);
  if(m)return v2>=+m[1]&&v2<=+m[2];
  if(/^-?[\d.]+$/.test(s))return v2===+s;
  return String(v).includes(s);
}
function planFiltered(){
  const cols=PCOLS.filter(c=>c.on);
  let rows=PLANROWS.filter(r=>cols.every(c=>{
    const f=PFILT[c.k]; if(!f)return true;
    if(c.filt==='num')return numMatch(c.fv(r),f);
    if(c.filt==='enum')return String(c.fv(r)||'')===f;
    return String(c.fv(r)||'').toLowerCase().includes(f.toLowerCase());
  }));
  const col=PCOLS.find(c=>c.k===PSORT.k)||PCOLS[0];
  rows.sort((a,b)=>{
    const r=cmpKey(col.sv(a),col.sv(b))*PSORT.d;
    // 同鍵值時固定用「廠商（數字優先）→ 產品代號」當第二層（使用者指定的預設排序）
    return r || cmpKey(vendKey(a.vendor),vendKey(b.vendor))
             || String(a.c).localeCompare(String(b.c),'zh-Hant',{numeric:true});
  });
  return rows;
}

/** 畫決策表格 */
function drawPlan(){
  if(!PLANROWS.length){$('tb3').innerHTML='<tr><td class="empty">沒有資料</td></tr>';return;}
  const cols=PCOLS.filter(c=>c.on);
  const rows=PLANROWS, show=planFiltered();
  const need=show.filter(r=>r.order>0);
  const edited=rows.filter(r=>r.order!==r.order0).length;
  const pend=Object.keys(PEND.ship).length+Object.keys(PEND.boxn).length;
  $('planStats').innerHTML=[
    ['參與計算',rows.length.toLocaleString(),''],
    ['排除「關閉」',(PLANMETA.closed||0).toLocaleString(),''],
    ['篩選後',show.length.toLocaleString(),''],
    ['建議下單',need.length.toLocaleString(),'sale'],
    ['建議總量',N(need.reduce((s,r)=>s+r.order,0)),'sale'],
    ['預估金額',N(need.reduce((s,r)=>s+r.order*r.cost,0)),''],
    ['緊急補貨',show.filter(r=>r.status.includes('緊急')).length,''],
    ['手動調整',edited?`<span style="color:var(--warn)">${edited}</span>`:'0',''],
    ['待回填',pend?`<span style="color:var(--warn)">${pend}</span>`:'0',''],
  ].map(([k,v,c])=>`<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('');

  // 表頭＋篩選列
  $('th3').innerHTML='<tr>'+cols.map(c=>
      `<th class="${c.l?'l ':''}${c.code?'code':''}" data-k="${c.k}">${esc(c.t)}${
        PSORT.k===c.k?(PSORT.d<0?' ▾':' ▴'):''}</th>`).join('')+'</tr>'
    +'<tr class="frow">'+cols.map(c=>{
      if(c.filt==='enum'){
        const vals=[...new Set(PLANROWS.map(x=>String(c.fv(x)||'')))].sort((a,b)=>
          c.k==='vendor'?cmpKey(vendKey(a),vendKey(b)):a.localeCompare(b,'zh-Hant',{numeric:true}));
        return `<th><select data-f="${c.k}" class="${PFILT[c.k]?'act':''}"><option value="">全部</option>`
          +vals.map(v=>`<option value="${esc(v)}" ${PFILT[c.k]===v?'selected':''}>${
            esc(c.k==='vendor'?(vend(v)||'（空白）'):(v||'（空白）'))}</option>`).join('')+'</select></th>';
      }
      const ph=c.filt==='num'?'>0':'含…';
      return `<th><input type="text" data-f="${c.k}" placeholder="${ph}" value="${esc(PFILT[c.k]||'')}"></th>`;
    }).join('')+'</tr>';
  $('th3').querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k, c=PCOLS.find(x=>x.k===k);
    // 第一次點：數字欄由大到小（要看的是「哪些最多」）、文字欄由小到大
    PSORT.k===k?PSORT.d*=-1:(PSORT.k=k,PSORT.d=(c&&c.filt==='num')?-1:1); drawPlan();});
  mkColResize('th3','plan');
  $('th3').querySelectorAll('[data-f]').forEach(el=>{
    const h=deb(()=>{const v=el.value.trim();
      v?PFILT[el.dataset.f]=v:delete PFILT[el.dataset.f];
      PSEL.clear();               // 篩選變了就清選取，免得「套用到選取列」動到看不見的列
      drawPlan();},220);
    el.tagName==='SELECT'?el.onchange=h:el.oninput=h;
    el.onclick=e=>e.stopPropagation();
  });

  $('tb3').innerHTML=show.length?show.map(r=>
    `<tr data-k="${r.row}" class="${PSEL.has(String(r.row))?'msel':''}${
      PPICK&&PPICK.kind==='code'&&PPICK.key===r.c?' sel':''}">`
    +cols.map(c=>`<td class="${c.l?'l ':''}${c.code?'code':''}">${c.get(r)}</td>`).join('')+'</tr>').join('')
    :`<tr><td class="empty" colspan="${cols.length}">沒有符合篩選條件的項目</td></tr>`;

  // 手動改補貨量 → 立即重算統計與要貼回的內容（負數一律 0）
  $('tb3').querySelectorAll('input.ordin').forEach(inp=>{
    inp.onchange=()=>{
      const r=PLANROWS.find(x=>x.row==inp.dataset.row);
      if(!r)return;
      const v=Math.max(0,Math.round(+inp.value||0));
      inp.value=v;
      r.order=v; r.boxes=(r.boxn>0&&v>0)?v/r.boxn:0;
      if(v>0)r.suitable=true;            // 人工指定就照人工的
      drawPlan();
    };
    inp.onclick=e=>e.stopPropagation();
    inp.onmousedown=e=>e.stopPropagation();
  });
  // B5：裝箱數可改（記進 PEND，回填時寫 AA 欄）
  $('tb3').querySelectorAll('input.boxin').forEach(inp=>{
    inp.onchange=()=>{
      const row=+inp.dataset.box, it=PLAN.items.find(x=>x.row===row);
      const v=inp.value.trim()===''?0:Math.max(0,+inp.value||0);
      if(it&&v===(it.boxn||0))delete PEND.boxn[row]; else PEND.boxn[row]=v;
      runPlan();
    };
    inp.onclick=e=>e.stopPropagation();
    inp.onmousedown=e=>e.stopPropagation();
  });
  // B8／B9：點產品代號看走勢、點廠商看該廠商（＝中類）整體
  $('tb3').querySelectorAll('[data-code]').forEach(el=>{
    el.onmousedown=e=>e.stopPropagation();
    el.onclick=e=>{e.stopPropagation();
      const k=el.dataset.code;
      PPICK=(PPICK&&PPICK.kind==='code'&&PPICK.key===k)?null:{kind:'code',key:k};
      drawPlanChart(); drawPlan();};
  });
  $('tb3').querySelectorAll('[data-vendor]').forEach(el=>{
    el.onmousedown=e=>e.stopPropagation();
    el.onclick=e=>{e.stopPropagation();
      const k=el.dataset.vendor;
      PPICK=(PPICK&&PPICK.kind==='vendor'&&PPICK.key===k)?null:{kind:'vendor',key:k};
      drawPlanChart(); drawPlan();};
  });
  if(!_pselMark)_pselMark=mkDragSelect($('tb3'),()=>{},PSEL,
    ()=>{drawPlanSel();drawPlanChart();});     // ★ 多選變動 → 圖表一起算
  else _pselMark();
  drawPlanSel();

  const lines=buildClip();
  $('cnt3').textContent=`共 ${rows.length.toLocaleString()} 項參與計算，篩選後 ${show.length.toLocaleString()} 項，`
    +`其中 ${need.length} 項建議下單`+(edited?`　·　已手動調整 ${edited} 項`:'')
    +`　·　點代號看走勢、點廠商看中類、拖曳可多選`;
  $('pasteNote').innerHTML=`複製內容共 <b>${lines.toLocaleString()}</b> 行 →
    貼回「庫存規劃」的 <b>AR</b> 欄（AI參考／狀態／銷售狀況／商品代號）`+
    (PLANMETA.keepClosed?'；已含「關閉」空白列，可直接整批貼'
     :'；<b>「關閉」的列沒有輸出，貼之前請先在試算表篩選隱藏它們</b>');
  const nd=PLANMETA.nd||0;
  $('planHint').innerHTML=nd<90?`⚠ 目前只有 <b>${nd}</b> 天資料，30/90 天策略會取到同一批
    （趨勢恆為 0）。等每日自動匯出累積滿 90 天以上才準。`:'';
}
let _pselMark=null;
/** 決策頁選取列 → 顯示合計＋開啟「一起改物流／裝箱數」工具列（B4/B5） */
function drawPlanSel(){
  const rows=PLANROWS.filter(r=>PSEL.has(String(r.row)));
  const bar=$('selbar3'), edit=$('planEditBar');
  if(!rows.length){bar.classList.remove('on');bar.innerHTML='';edit.style.display='none';return;}
  bar.classList.add('on');
  bar.innerHTML=[['選取',rows.length+' 項'],
    ['應補貨量',N(rows.reduce((s,r)=>s+r.order,0))],
    ['預估金額',N(rows.reduce((s,r)=>s+r.order*r.cost,0))],
    ['現有庫存',N(rows.reduce((s,r)=>s+r.currentStock,0))],
    ['在途',N(rows.reduce((s,r)=>s+r.inTransit,0))],
    ['日均銷',N1(rows.reduce((s,r)=>s+r.final,0))]]
    .map(([k,v])=>`<span><span class="k">${k}</span> <b>${v}</b></span>`).join('');
  edit.style.display='';
  $('pselN').textContent=`已選 ${rows.length} 項`;
  if(!$('shipBtns').innerHTML){
    const set=new Set();
    PLAN.items.forEach(it=>String(it.ship||'').split(/[\/、]/).forEach(s=>{s=s.trim();if(s)set.add(s);}));
    // 固定「海運 → 海快 → 巧巧郎 → 其他」的順序：寫回 C 欄的字串才會跟人工習慣一致
    const rank=s=>s.includes('海運')?0:s.includes('海快')?1:(s.includes('巧巧郎')||s.includes('巧郎'))?2:3;
    SHIPOPTS=[...set].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b,'zh-Hant'));
    $('shipBtns').innerHTML=SHIPOPTS.map(s=>{
      const cls=s.includes('海運')?'t-sea':s.includes('海快')?'t-fast':s.includes('巧巧郎')?'t-qiao':'t-cool';
      return `<button data-ship="${esc(s)}" class="shipopt"><span class="tag ${cls}">${esc(s)}</span></button>`;
    }).join('')+`<button data-ship="" class="shipopt">（清空）</button>`;
    $('shipBtns').querySelectorAll('.shipopt').forEach(b=>b.onclick=()=>{
      if(b.dataset.ship==='')$('shipBtns').querySelectorAll('.shipopt').forEach(x=>x.classList.remove('on'));
      else b.classList.toggle('on');});
  }
}
let SHIPOPTS=[];
function applyShip(){
  const picked=[...$('shipBtns').querySelectorAll('.shipopt.on')].map(b=>b.dataset.ship);
  const val=picked.join('/');
  const rows=[...PSEL];
  if(!rows.length)return;
  rows.forEach(k=>{
    const row=+k, it=PLAN.items.find(x=>x.row===row);
    if(it&&(it.ship||'')===val)delete PEND.ship[row]; else PEND.ship[row]=val;
  });
  runPlan();
}
function applyBox(){
  const v=$('boxSet').value.trim();
  if(v==='')return;
  const n=Math.max(0,+v||0);
  [...PSEL].forEach(k=>{
    const row=+k, it=PLAN.items.find(x=>x.row===row);
    if(it&&(it.boxn||0)===n)delete PEND.boxn[row]; else PEND.boxn[row]=n;
  });
  runPlan();
}

/* ---------- 決策頁的走勢圖（B8 產品／B9 廠商＝中類） ---------- */
function drawPlanChart(){
  const box=$('planChartBox');
  const tmap=new Map(DATA.products.map(p=>[p.c,p]));
  // ★ 2026-08-05 使用者：「拖曳多選可以批次設定，希望上面的圖表也一起計算」
  //   沒有點選單品／廠商時，只要有多選就畫「選取的那幾項」合計。
  if(!PPICK){
    if(!PSEL.size){box.style.display='none';return;}
    const codes=PLANROWS.filter(r=>PSEL.has(String(r.row))).map(r=>r.c);
    const src2=codes.map(c=>tmap.get(c)).filter(Boolean);
    box.style.display='';
    $('pChartTitle').textContent=`選取的 ${codes.length.toLocaleString()} 項`;
    $('pChartNote').textContent=`流量表對到 ${src2.length} 項`;
    return planChartDraw(src2);
  }
  box.style.display='';
  let src=[],title='',note='';
  if(PPICK.kind==='code'){
    const p=tmap.get(PPICK.key);
    if(p)src=[p];
    const r=PLANROWS.find(x=>x.c===PPICK.key);
    title=`${PPICK.key}　${r?r.n:(p?p.n:'')}`;
    if(!p)note='流量表裡沒有這個代號（可能是新品或已停用）';
  }else{
    const v=PPICK.key;
    const codes=PLANROWS.filter(r=>String(r.vendor)===String(v)).map(r=>r.c);
    src=codes.map(c=>tmap.get(c)).filter(Boolean);
    // 這個廠商的品項落在哪些分類。使用者說「我的中類就是廠商」，實際比對資料是
    // **廠商代號 ↔ 小類代號**（廠商 02 → 小類 002.002密封袋、11 → 011.011濕巾），
    // 所以這裡把中類與小類都列出來，兩種說法都對得上。
    const cats=[...new Set(src.map(p=>{
      const mid=((DATA.meta.mids||[])[p.g1]||[])[p.g2]||'';
      return DATA.meta.cats[p.g1]+(mid?' / '+mid:'')+(p.g3?' / '+p.g3:'');}))];
    title=`廠商 ${vend(v)||'（空白）'}　整體`;
    note=`${codes.length} 項（流量表對到 ${src.length} 項）`+(cats.length?`　·　${cats.slice(0,3).join('、')}${cats.length>3?'…':''}`:'');
  }
  $('pChartTitle').textContent=title;
  $('pChartNote').textContent=note;
  planChartDraw(src);
}
/** 345 決策頁的曲線繪製（抽出來，讓「點單品／點廠商／拖曳多選」三種來源共用） */
function planChartDraw(src){
  const B=buckets();
  const sale=[],buy=[],stock=[];
  B.forEach(b=>{let s=0,i2=0,st=0;
    src.forEach(p=>{const {a}=R;
      b.idx.forEach(i=>{s+=p.d[(a+i)*4+2];i2+=p.d[(a+i)*4+1];});
      st+=p.d[(a+b.idx[b.idx.length-1])*4];});
    sale.push(s);buy.push(i2);stock.push(st);});

  const show={sale:$('pSale').checked,buy:$('pBuy').checked,stock:$('pStock').checked};
  const H=190,W=Math.max(320,$('pcwrap').clientWidth-4);   // ★ 第 9 項：30 天／120 天都塞滿一個螢幕
  const PL=52,PR=show.stock&&(show.sale||show.buy)?46:14,PT=12,PB=24;
  const iw=W-PL-PR,ih=H-PT-PB, xs=i=>PL+(B.length===1?iw/2:i*(iw/(B.length-1)));
  const maxL=Math.max(1,...(show.sale?sale:[]),...(show.buy?buy:[])), maxR=Math.max(1,...stock);
  const yL=v=>PT+ih-(v/maxL)*ih, yR=v=>PT+ih-(v/maxR)*ih;
  let g='';
  for(let i=0;i<=4;i++){const y=PT+ih*(i/4);
    g+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--line)" ${i<4?'stroke-dasharray="2,3"':''}/>`
     +`<text x="${PL-6}" y="${y+3.5}" font-size="10" fill="var(--muted)" text-anchor="end">${N(maxL*(1-i/4))||0}</text>`;
    if(show.stock&&(show.sale||show.buy))
      g+=`<text x="${W-PR+6}" y="${y+3.5}" font-size="10" fill="var(--stock)">${N(maxR*(1-i/4))||0}</text>`;}
  const step=Math.max(1,Math.ceil(B.length/Math.max(6,Math.floor(iw/64))));
  B.forEach((b,i)=>{if(i%step===0||i===B.length-1)
    g+=`<text x="${xs(i)}" y="${H-7}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(b.label)}</text>`;});
  const poly=(a,fy,c,w)=>`<polyline points="${a.map((v,i)=>xs(i)+','+fy(v)).join(' ')}" fill="none"
      stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`;
  if(show.stock)g+=poly(stock,yR,'var(--stock)',1.6);
  if(show.buy)  g+=poly(buy,yL,'var(--buy)',1.8);
  if(show.sale) g+=poly(sale,yL,'var(--sale)',2.1);
  const hz=B.map((b,i)=>{const w=iw/B.length;
    return `<rect x="${(xs(i)-w/2).toFixed(1)}" y="${PT}" width="${w.toFixed(1)}" height="${ih}"
      fill="transparent" data-i="${i}"/>`;}).join('');
  const svg=$('chart3');
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.innerHTML=g+hz;
  hover(svg,$('tip3'),$('pcwrap'),i=>`<b>${esc(B[i].full)}</b><br>`+
    `<span class="dot" style="background:var(--sale)"></span>銷貨 <b>${N(sale[i])||0}</b><br>`+
    `<span class="dot" style="background:var(--buy)"></span>進貨 <b>${N(buy[i])||0}</b><br>`+
    `<span class="dot" style="background:var(--stock)"></span>庫存 <b>${N(stock[i])||0}</b>`);
}

function copyPlan(){
  if(!CLIP)return alert('還沒有計算結果');
  navigator.clipboard.writeText(CLIP).then(()=>{
    const b=$('btnCopy'),o=b.textContent;
    b.textContent='✅ 已複製，請到 AR 欄頂端貼上';b.classList.add('on');
    setTimeout(()=>{b.textContent=o;b.classList.remove('on');},4000);
  }).catch(()=>alert('複製失敗，請改用手動選取'));
}

/* =========================================================================
   B4/B5/B6：一鍵回填「345庫存規劃」
   ★ 寫入正式試算表，所以一定要**先預覽差異、按確認才寫**，寫完回報筆數。
   ★ 走的是繫結在「345庫存規劃」底下的 GAS（W345_URL），權限只有那一本。
   ========================================================================= */
let PUSHPLAN=null;
function openPush(){
  if(!PLANROWS.length)return alert('還沒有計算結果');
  const ar=planOut(true);
  const ship=Object.entries(PEND.ship).map(([row,v])=>{
    const it=PLAN.items.find(x=>x.row===+row)||{};
    return {row:+row,c:it.c||'',n:it.n||'',old:it.ship||'',now:v};});
  const boxn=Object.entries(PEND.boxn).map(([row,v])=>{
    const it=PLAN.items.find(x=>x.row===+row)||{};
    return {row:+row,c:it.c||'',n:it.n||'',old:it.boxn||0,now:v};});
  PUSHPLAN={ar,ship,boxn};
  const nz=ar.filter(o=>o.v[0]!=='').length;
  $('mTitle').textContent='回填預覽（確認後才會寫入試算表）';
  let h=`<p class="hint" style="margin:8px 0">目標試算表：<b>345庫存規劃 / 庫存規劃</b>　`
    +`（回填走的是繫結在那一本底下的 GAS，權限只有那一本）</p>`;
  h+=`<h4 style="margin:10px 0 4px">① AR:AU 四欄（AI參考／狀態／銷售狀況／商品代號）</h4>`
    +`<p class="hint"><b>整段覆蓋 AR${ar.length?ar[0].row:2}:AU${ar.length?ar[ar.length-1].row:2}</b>`
    +`（${ar.length.toLocaleString()} 列，其中有下單量的 <b>${nz}</b> 列）。`
    +`沒有建議的列會寫成<b>空白</b>——包含「關閉」的列，這樣才不會留下上一輪的殘值。`
    +`<br>（畫面上那個「關閉也輸出空白列」勾選只影響「📋 複製四欄」，回填一律整段對齊寫。）</p>`;
  h+=`<h4 style="margin:10px 0 4px">② C 欄「貨運方式」${ship.length?`（${ship.length} 筆）`:'（沒有修改）'}</h4>`;
  if(ship.length)h+=diffTable(ship);
  h+=`<h4 style="margin:10px 0 4px">③ AA 欄「裝箱數」${boxn.length?`（${boxn.length} 筆）`:'（沒有修改）'}</h4>`;
  if(boxn.length)h+=diffTable(boxn)
    +`<p class="hint">⚠ 只寫 <b>AA 欄（數字）</b>；Z 欄「裝箱量」的文字原樣不動（那一欄混了非裝箱資訊，`
    +`硬改會弄壞人工註記）。</p>`;
  $('mBody').innerHTML=h;
  $('mNote').textContent=WRITE_URL?'':'⚠ 尚未設定 345 的回填後端網址（W345_URL），現在只能預覽。';
  $('mGo').disabled=!WRITE_URL;
  $('mask').classList.add('on');
}
const diffTable=list=>`<table><thead><tr><th class="l">列</th><th class="l">產品代號</th>
  <th class="l">品名</th><th class="l">原值</th><th class="l">改成</th></tr></thead><tbody>`
  +list.map(x=>`<tr><td class="l dim">${x.row}</td><td class="l">${esc(x.c)}</td>
    <td class="l"><span class="nm">${esc(x.n)}</span></td>
    <td class="l old">${esc(String(x.old===0?'':x.old))||'（空白）'}</td>
    <td class="l new">${esc(String(x.now===0?'':x.now))||'（空白）'}</td></tr>`).join('')
  +'</tbody></table>';

async function doPush(){
  if(!PUSHPLAN||!WRITE_URL)return;
  const b=$('mGo'), o=b.textContent;
  b.disabled=1; b.textContent='寫入中…';
  try{
    const r=await fetch(WRITE_URL,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'writeback',ar:PUSHPLAN.ar,ship:PUSHPLAN.ship,boxn:PUSHPLAN.boxn})});
    const j=await r.json();
    if(j.ok){
      PEND.ship={}; PEND.boxn={};
      $('mBody').innerHTML=`<p style="padding:14px 0"><b style="color:var(--ok)">✅ 寫入完成</b><br>`
        +`AR:AU ${j.ar||0} 列　·　C 欄貨運方式 ${j.ship||0} 筆　·　AA 欄裝箱數 ${j.boxn||0} 筆`
        +`<br><span class="hint">試算表端時間 ${esc(j.at||'')}</span></p>`;
      b.style.display='none'; $('mCancel').textContent='關閉';
      $('mCancel').onclick=()=>{$('mask').classList.remove('on');b.style.display='';
        $('mCancel').textContent='取消';$('mCancel').onclick=()=>$('mask').classList.remove('on');
        runPlan();};
    }else{
      $('mNote').textContent='✘ 寫入失敗：'+(j.error||'未知錯誤');
      b.disabled=0; b.textContent=o;
    }
  }catch(e){
    $('mNote').textContent='✘ 寫入失敗：'+e.message;
    b.disabled=0; b.textContent=o;
  }
}

addEventListener('resize',deb(()=>{if(DATA){
  if(TAB==='sale')drawSale(); else if(TAB==='plan')drawPlanChart(); else {drawChart();drawTable();}
}},220));
boot();
