<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>倉儲系統已搬家</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f4f2f8;font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:#2f2a3a}
  .box{max-width:420px;width:calc(100% - 32px);background:#fff;border-radius:16px;
       box-shadow:0 6px 24px rgba(70,50,110,.12);padding:28px 24px;text-align:center}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:#6b6480;font-size:15px;line-height:1.7;margin:0 0 20px}
  a.go{display:block;background:#5b3d8f;color:#fff;text-decoration:none;font-size:19px;
       font-weight:bold;padding:16px;border-radius:12px}
  a.go:active{background:#4a3175}
  .note{margin-top:18px;font-size:13px;line-height:1.8;color:#8a8399;text-align:left}
  .note b{color:#c62828}
  .cd{font-size:13px;color:#8a8399;margin-top:14px}
</style>
</head>
<body>
<div class="box">
  <h1>倉儲系統已經換新版了</h1>
  <p class="sub">舊版從 2026/09/03 起停用，<br>請改用新版（功能一樣，速度更快）。</p>
  <a class="go" id="go" href="https://warehouse-web-tw.web.app">前往新版倉儲系統 →</a>
  <div class="cd" id="cd">5 秒後自動前往…</div>
  <div class="note">
    ・第一次進去要用<b>公司的 Google 帳號</b>登入，登入後選自己的名字。<br>
    ・請把手機書籤改成新版網址。<br>
    ・如果舊版上還有「待送清單」沒送出去的點貨，<b>先找主管</b>，不要直接關掉。
  </div>
</div>
<script>
  var n = 5, cd = document.getElementById('cd');
  var t = setInterval(function () {
    n--;
    if (n <= 0) { clearInterval(t); location.replace('https://warehouse-web-tw.web.app'); return; }
    cd.textContent = n + ' 秒後自動前往…';
  }, 1000);
</script>
</body>
</html>
